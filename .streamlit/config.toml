[theme]
base = "light"
primaryColor = "#0E7F7B"
backgroundColor = "#F4F6FB"
secondaryBackgroundColor = "#E8ECF5"
textColor = "#23263A"
font = "sans serif"

[server]
# Streamlit's file watcher scans every imported module; on transformers it tries to load
# optional vision models (needs torchvision) and prints a long error. Not needed for the demo.
fileWatcherType = "none"
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
